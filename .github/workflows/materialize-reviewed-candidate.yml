name: Materialize reviewed release candidate
on:
  push:
    branches: [release/1.0.0-desktop-integration]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.repository == 'CineHarbor/cineharbor-desktop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply exact checkpointed candidate on its preparation branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, lzma, hashlib, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = '1fd69e23d3d493b57ac280ff72623ab0eadb7d4d'
          branch = 'release/1.0.0-desktop-integration'
          helper = '.github/workflows/materialize-reviewed-candidate.yml'
          payload = '.github/reviewed-candidate/patch.txt'
          assert os.environ['GITHUB_REPOSITORY'] == 'CineHarbor/cineharbor-desktop'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert git('rev-parse', 'HEAD^') == base, 'AGNIR_CHECKPOINT_CONFLICT: unexpected parent'
          assert sorted(git('diff', '--name-only', 'HEAD^', 'HEAD').splitlines()) == sorted([helper, payload])
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == base, 'AGNIR_CHECKPOINT_CONFLICT: main advanced'
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == os.environ['GITHUB_SHA'], 'branch advanced'
          patch = lzma.decompress(base64.b64decode(pathlib.Path(payload).read_text(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5caa8f623db0dd285179c0f01c94404c1eff4e5aa69e5c3a34872bc00f55b0c1'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', str(path)], check=True)
          subprocess.run(['git', 'rm', helper, payload], check=True)
          assert git('write-tree') == '63c5aca6d430fb86e0aa7f791df79a37efc86a38', 'candidate tree mismatch'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(release): align reviewed Desktop integration and retire transport'], check=True)
          subprocess.run(['gh', 'auth', 'setup-git'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == git('rev-parse', 'HEAD')
          print('VERIFIED_CANDIDATE=' + git('rev-parse', 'HEAD'))
          print('VERIFIED_TREE=' + git('write-tree'))
