name: Prepare Desktop Release Candidate

on:
  push:
    tags:
      - desktop-v*

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  csp_preflight:
    name: Validate Tauri CSP Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Tauri CSP contract
        run: pnpm check:tauri-csp

  ensure_release:
    name: Ensure GitHub Release
    runs-on: ubuntu-latest
    needs: csp_preflight
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.ensure_release.outputs.release_id }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Create or update release from tag
        id: ensure_release
        run: node scripts/ensure-desktop-release.mjs --tag "${{ github.ref_name }}" --target "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"

  publish_release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: ensure_release
    permissions:
      contents: write
    timeout-minutes: 90
    defaults:
      run:
        working-directory: workspace/cineharbor-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.ci.conf.json

    env:
      CI: true
      HUSKY: 0
      CARGO_TERM_COLOR: always
      NEXT_TELEMETRY_DISABLED: 1
      SITE_BASE: ${{ vars.SITE_BASE || '' }}
      CINEHARBOR_RELEASE_REPOSITORY: ${{ github.repository }}
      NEXT_PUBLIC_RELEASE_REPOSITORY: ${{ github.repository }}
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: workspace/cineharbor-desktop
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.14.0
          package_json_file: workspace/cineharbor-desktop/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: workspace/cineharbor-desktop/pnpm-lock.yaml

      - name: Setup pinned Rust
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.target }} --target wasm32-unknown-unknown

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace/cineharbor-desktop -> target
            workspace/cineharbor-core -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Tauri CSP contract
        run: pnpm check:tauri-csp

      - name: Sync desktop version
        run: node scripts/sync-desktop-version.mjs --tag "${{ github.ref_name }}"

      - name: Validate updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi

      - name: Sync updater endpoint
        run: pnpm desktop:sync:updater-config

      - name: Checkout immutable integration dependencies
        run: python3 scripts/ci-checkout.py

      - name: Install matching WASM bridge
        shell: bash
        run: |
          set -euo pipefail
          version=$(node ../cineharbor-web/scripts/build-core-wasm.mjs --print-bindgen-version)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build desktop frontend
        shell: bash
        run: |
          set -euo pipefail
          (cd ../cineharbor-web && pnpm install --frozen-lockfile && node scripts/build-desktop-frontend.mjs)
          cp -R ../cineharbor-web/desktop-shell-dist desktop-shell-dist

      - name: Build desktop sidecar
        run: node scripts/sync-desktop-sidecar.mjs --release --target ${{ matrix.target }}

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: workspace/cineharbor-desktop
          releaseId: ${{ needs.ensure_release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: pnpm exec tauri
          args: ${{ matrix.args }}

  release_outcome:
    name: Evaluate Release Outcome
    runs-on: ubuntu-latest
    needs: publish_release
    if: ${{ always() }}
    outputs:
      should_publish: ${{ steps.evaluate.outputs.should_publish }}
      summary_conclusion: ${{ steps.evaluate.outputs.summary_conclusion }}
      success_count: ${{ steps.evaluate.outputs.success_count }}
      total_count: ${{ steps.evaluate.outputs.total_count }}
      succeeded_platforms: ${{ steps.evaluate.outputs.succeeded_platforms }}
      failed_platforms: ${{ steps.evaluate.outputs.failed_platforms }}
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Evaluate desktop build results
        id: evaluate
        uses: actions/github-script@v7
        with:
          script: |
            const { evaluatePlatformBuilds } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-gates.mjs`);
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              }
            );
            const result = evaluatePlatformBuilds(jobs);
            const { succeededPlatforms, failedPlatforms, successCount, totalCount } = result;
            const summaryConclusion = result.complete ? 'success' : 'failure';
            core.setOutput('should_publish', String(result.complete));
            core.setOutput('summary_conclusion', summaryConclusion);
            core.setOutput('success_count', String(successCount));
            core.setOutput('total_count', String(totalCount));
            core.setOutput(
              'succeeded_platforms',
              JSON.stringify(succeededPlatforms)
            );
            core.setOutput('failed_platforms', JSON.stringify(failedPlatforms));

            if (!result.complete) {
              core.setFailed('Not all required desktop platforms succeeded.');
            }

  publish_release_summary:
    name: Publish Release Summary
    runs-on: ubuntu-latest
    needs: [publish_release, release_outcome]
    if: ${{ always() }}
    permissions:
      checks: write

    steps:
      - name: Publish desktop platform summary check
        uses: actions/github-script@v7
        env:
          SUMMARY_CONCLUSION: ${{ needs.release_outcome.outputs.summary_conclusion }}
          SUCCESS_COUNT: ${{ needs.release_outcome.outputs.success_count }}
          TOTAL_COUNT: ${{ needs.release_outcome.outputs.total_count }}
          SUCCEEDED_PLATFORMS: ${{ needs.release_outcome.outputs.succeeded_platforms }}
          FAILED_PLATFORMS: ${{ needs.release_outcome.outputs.failed_platforms }}
        with:
          script: |
            const successCount = Number(process.env.SUCCESS_COUNT || '0');
            const totalCount = Number(process.env.TOTAL_COUNT || '0');
            const summaryConclusion =
              process.env.SUMMARY_CONCLUSION || 'failure';
            const succeededPlatforms = JSON.parse(
              process.env.SUCCEEDED_PLATFORMS || '[]'
            );
            const failedPlatforms = JSON.parse(
              process.env.FAILED_PLATFORMS || '[]'
            );
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const title =
              summaryConclusion === 'success'
                ? `All desktop platforms succeeded: ${successCount}/${totalCount}`
                : `Incomplete platform build: ${successCount}/${totalCount} succeeded`;

            const summaryLines = [
              `Workflow run: ${runUrl}`,
              '',
              `Succeeded platforms (${succeededPlatforms.length}):`,
              ...(succeededPlatforms.length > 0
                ? succeededPlatforms.map((platform) => `- ${platform}`)
                : ['- none']),
              '',
              `Failed platforms (${failedPlatforms.length}):`,
              ...(failedPlatforms.length > 0
                ? failedPlatforms.map((platform) => `- ${platform}`)
                : ['- none']),
            ];

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Desktop Platform Build Summary',
              head_sha: context.sha,
              status: 'completed',
              conclusion: summaryConclusion,
              output: {
                title,
                summary: summaryLines.join('\n'),
              },
            });

  normalize_release_assets:
    name: Normalize Release Assets
    runs-on: ubuntu-latest
    needs: [publish_release, release_outcome]
    if: ${{ always() && needs.release_outcome.outputs.should_publish == 'true' }}
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Normalize desktop release assets
        run: node scripts/normalize-desktop-release-assets.mjs --tag "${{ github.ref_name }}"

