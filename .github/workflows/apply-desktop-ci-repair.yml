name: Apply reviewed Desktop CI repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-desktop-ci-repair.yml', 'scripts/repair-desktop-ci.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: apply-reviewed-desktop-ci-repair
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - name: Reject stale checkpoint and validate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA" || { echo AGNIR_CHECKPOINT_CONFLICT; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          text = Path('AGNIR.yaml').read_text()
          for expected in ['urn:cineharbor:project:cineharbor-desktop', 'urn:cineharbor:lineage:cineharbor-desktop', 'repository-filesystem/1.0', 'b5626394ec40a5cb7a28c01892acde07cc0adc8e']:
              if expected not in text:
                  raise SystemExit('AGNIR_CHECKPOINT_CONFLICT: identity or provenance changed')
          PY
      - name: Apply exact reviewed source transformation
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          python3 scripts/repair-desktop-ci.py
      - name: Execute portable pre-commit gates
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test --runInBand
          pnpm test:tooling
          pnpm check:tauri-csp
          cargo fmt --all -- --check
          git diff --check
      - name: Reconcile checkpoint and retire one-time helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          for name in ['.agnir/state.md', '.agnir/evidence/2026-09-19-desktop-native-ci-repair.md']:
              path = Path(name)
              text = path.read_text()
              if text.count('**DESKTOP_CI_REPAIR = pending.**') != 1:
                  raise SystemExit('AGNIR_CHECKPOINT_CONFLICT: repair checkpoint changed')
              text = text.replace('**DESKTOP_CI_REPAIR = pending.**', '**DESKTOP_CI_REPAIR = applied.**')
              text += '\nThe exact Rust repair was applied and portable pre-commit gates passed in Actions run ' + os.environ['GITHUB_RUN_ID'] + '. The temporary writer was retired in this same revision. Native CI, signed RC and real updater acceptance remain pending; RELEASE_READY stays false.\n'
              path.write_text(text)
          PY
          git rm .github/workflows/apply-desktop-ci-repair.yml scripts/repair-desktop-ci.py
          git add src-tauri/src/lib.rs .agnir/state.md .agnir/evidence/2026-09-19-desktop-native-ci-repair.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA" || { echo AGNIR_CHECKPOINT_CONFLICT; exit 1; }
          git commit -m 'fix(desktop): apply reviewed strict Rust diagnostics and retire repair helper'
          git push origin HEAD:main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$(git rev-parse HEAD)"
          git fetch origin main
          git show origin/main:AGNIR.yaml
          git show origin/main:.agnir/state.md
      - name: Start mandatory native verification
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
