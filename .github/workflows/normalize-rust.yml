name: Normalize owned Desktop Rust once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-rust.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  normalize:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Read activation and validate the selected lineage
        run: |
          set -euo pipefail
          cat AGENTS.md AGNIR.md AGNIR.yaml .agnir/state.md .agnir/next-actions.md
          grep -F 'identity: "urn:cineharbor:project:cineharbor-desktop"' AGNIR.yaml
          grep -F 'lineage: "urn:cineharbor:lineage:cineharbor-desktop"' AGNIR.yaml
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Normalize only this Rust workspace
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Publish coherent formatting checkpoint and retire this helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [ "$current" = "$GITHUB_SHA" ] || { echo AGNIR_CHECKPOINT_CONFLICT; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path
          evidence = Path('.agnir/evidence/2026-09-19-rust-format-applied.md')
          evidence.write_text('# Owned Rust formatting checkpoint\n\n'
              + 'Parent: `' + os.environ['GITHUB_SHA'] + '`. Run: https://github.com/'
              + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n\n'
              + 'Rust 1.98.1 cargo fmt normalized this repository only; the following cargo fmt --all -- --check passed. '
              + 'This is formatting evidence, not native check/test/Clippy/bundle or signed updater acceptance. '
              + 'Identity and lineage are unchanged. Current main was re-resolved before publication; a non-force push rejects a race. '
              + 'The one-time write-capable helper is retired in the same checkpoint.\n')
          state = Path('.agnir/state.md')
          state.write_text(state.read_text() + '\n## Applied formatting checkpoint\n\nOwned Rust formatting now passes with Rust 1.98.1. The one-time normalizer was removed. Native CI and signed upgrade acceptance remain separately required; RELEASE_READY remains false.\n')
          PY
          git rm .github/workflows/normalize-rust.yml
          git add src-tauri/src .agnir/state.md .agnir/evidence/2026-09-19-rust-format-applied.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(release): normalize owned Desktop Rust and retire helper'
          git push origin HEAD:main
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [ "$actual" = "$(git rev-parse HEAD)" ] || { echo AGNIR_CHECKPOINT_CONFLICT; exit 1; }
          for path in AGNIR.yaml .agnir/state.md .agnir/next-actions.md; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$actual" --jq '.content' | base64 --decode
          done
          gh workflow run ci.yml --ref main
          gh workflow run ci.yml --ref main
