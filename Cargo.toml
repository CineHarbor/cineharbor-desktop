[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
# 继承自上游旧项目公开授权（CC BY-NC-SA 4.0），见 LICENSE。
license = "CC-BY-NC-SA-4.0"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
base64 = "0.22.1"
futures = "0.3.31"
minisign-verify = "0.2"
reqwest = { version = "0.12.24", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "http2", "json", "rustls-tls", "stream"] }
rand = "0.9.4"
rfd = "0.17.2"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = "2.9.1"
tauri-build = "2.5.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
